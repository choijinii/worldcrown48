name: G-1 Admin Dashboard E2E (Playwright)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/admin/**'
      - 'components/admin/dashboard/**'
      - 'functions/src/getAdminKpis.ts'
      - 'functions/src/listAdminAlerts.ts'
      - 'functions/src/core/buildAdminKpis.ts'
      - 'functions/src/core/requireAdmin.ts'
      - 'lib/admin/dashboard/**'
      - 'lib/layout/domains.ts'
      - 'firestore.rules'
      - 'tests/rules/**'
      - 'e2e/g1-admin-dashboard.spec.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/g1-e2e.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # PREVIEW_URL은 아래 "Resolve … Preview URL" 스텝에서 head SHA로 해석(고정
      # G1_PREVIEW_URL 시크릿 폐기 — frozen-preview 함정 회피, feedback-c2-preview-url-pinned).
      # The E2E operator account — its uid MUST equal the preview's
      # NEXT_PUBLIC_ADMIN_UID or AdminAuthGuardLight redirects away.
      TEST_UID: ${{ secrets.G1_TEST_ADMIN_UID }}
      TEST_EMAIL: ${{ secrets.G1_TEST_ADMIN_EMAIL }}
      FIREBASE_ADMIN_SDK_KEY: ${{ secrets.FIREBASE_ADMIN_SDK_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Firestore emulator (rules tier) needs a JRE — Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-tools (emulator runner)
        run: npm i -g firebase-tools

      - name: Unit tests (vitest — client)
        run: npm run test:unit -- lib/__tests__/admin lib/__tests__/layout/domains.test.ts

      # canvas(그림 처리 꾸러미)는 보통 GitHub 에서 미리 만든 파일을 내려받는데, 그 내려받기가 시간 초과로
      # 막히면 원본 빌드로 넘어가고 시험 컴퓨터에 그래픽 부품이 없어 설치가 깨졌다(#157 · G-1 · B-1).
      # 부품을 먼저 깔고 functions npm ci 는 늘 원본에서 빌드한다 — 내려받기에 기대지 않는다(#158 과 같은 고침).
      - name: Install canvas build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Functions unit tests (vitest)
        env:
          npm_config_build_from_source: 'true'
        run: |
          npm ci --prefix functions
          npm test --prefix functions

      - name: Firestore Rules tests (emulator — admin_alerts deny)
        run: npm run test:rules

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Resolve this commit's own Vercel Preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Resolving the Preview deployment for commit $HEAD_SHA"
          URL=""
          for i in $(seq 1 40); do
            DID=$(gh api "repos/${{ github.repository }}/deployments?sha=$HEAD_SHA&environment=Preview" --jq '.[0].id // empty')
            if [ -n "$DID" ]; then
              URL=$(gh api "repos/${{ github.repository }}/deployments/$DID/statuses" \
                    --jq 'map(select(.state=="success"))[0].environment_url // empty')
            fi
            if [ -n "$URL" ]; then
              echo "Preview deployment ready: $URL"
              echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              break
            fi
            echo "Preview deployment for $HEAD_SHA not success yet (attempt $i/40) — sleeping 15s."
            sleep 15
          done
          if [ -z "$URL" ]; then
            echo "No successful Vercel Preview deployment for $HEAD_SHA after ~10m." >&2
            exit 1
          fi

      - name: Wait for Preview reachability (bypass-protected)
        run: |
          HEADER_ARGS=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADER_ARGS+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          for i in {1..30}; do
            if curl -fsSL --max-time 10 "${HEADER_ARGS[@]}" "$PREVIEW_URL" >/dev/null; then
              echo "Preview reachable at $PREVIEW_URL"; exit 0
            fi
            echo "Preview not reachable yet (attempt $i) — sleeping 10s."; sleep 10
          done
          echo "Preview never became reachable at $PREVIEW_URL." >&2; exit 1

      - name: E2E (Playwright — g1 spec only)
        # Scope to G-1's own spec (handoff §11.5 — feedback-workflow-spec-scope)
        # so this job never runs another module's spec against the wrong preview.
        run: npm run test:e2e -- e2e/g1-admin-dashboard.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace + video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g1-playwright-traces
          path: test-results/
          retention-days: 14
