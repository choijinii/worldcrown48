name: G-1 Admin Dashboard E2E (Playwright)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/admin/**'
      - 'components/admin/dashboard/**'
      - 'functions/src/getAdminKpis.ts'
      - 'functions/src/listAdminAlerts.ts'
      - 'functions/src/core/buildAdminKpis.ts'
      - 'functions/src/core/requireAdmin.ts'
      - 'lib/admin/dashboard/**'
      - 'lib/layout/domains.ts'
      - 'firestore.rules'
      - 'tests/rules/**'
      - 'e2e/g1-admin-dashboard.spec.ts'
      - 'playwright.config.ts'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: ${{ secrets.G1_PREVIEW_URL }}
      # The E2E operator account — its uid MUST equal the preview's
      # NEXT_PUBLIC_ADMIN_UID or AdminAuthGuardLight redirects away.
      TEST_UID: ${{ secrets.G1_TEST_ADMIN_UID }}
      TEST_EMAIL: ${{ secrets.G1_TEST_ADMIN_EMAIL }}
      FIREBASE_ADMIN_SDK_KEY: ${{ secrets.FIREBASE_ADMIN_SDK_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Firestore emulator (rules tier) needs a JRE — Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-tools (emulator runner)
        run: npm i -g firebase-tools

      - name: Unit tests (vitest — client)
        run: npm run test:unit -- lib/__tests__/admin lib/__tests__/layout/domains.test.ts

      - name: Functions unit tests (vitest)
        run: |
          npm ci --prefix functions
          npm test --prefix functions

      - name: Firestore Rules tests (emulator — admin_alerts deny)
        run: npm run test:rules

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel Preview
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "G1_PREVIEW_URL not set — skipping E2E wait/run."
            exit 0
          fi
          HEADER_ARGS=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADER_ARGS+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          for i in {1..30}; do
            if curl -fsSL --max-time 10 "${HEADER_ARGS[@]}" "$PREVIEW_URL" >/dev/null; then
              echo "Preview reachable at $PREVIEW_URL"
              exit 0
            fi
            echo "Preview not ready (attempt $i) — sleeping 10s."
            sleep 10
          done
          echo "Preview never became reachable." >&2
          exit 1

      - name: E2E (Playwright — g1 spec only)
        if: ${{ env.PREVIEW_URL != '' }}
        # Scope to G-1's own spec (handoff §11.5 — feedback-workflow-spec-scope)
        # so this job never runs another module's spec against the wrong preview.
        run: npm run test:e2e -- e2e/g1-admin-dashboard.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace + video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g1-playwright-traces
          path: test-results/
          retention-days: 14
