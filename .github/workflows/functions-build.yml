name: Functions build guard

# functions 가 실제로 배포 가능한 상태인지 지키는 가드.
#
# 왜 별도 워크플로인가 — 2026-09-06 사고:
# PR #89가 lib/crown/canvas/drawQR.ts 를 지우고 drawLink 인자를 6→5로 줄이고
# CrownData.campaign 을 필수로 만들면서 functions/ 는 한 파일도 안 고쳤다.
# 그 결과 functions 빌드가 깨진 채 머지됐고, 그 위에 올린 RUN-1 PR 1까지
# 배포 불가가 됐다. 발견은 배포를 시도한 순간이었다.
#
# 아무도 못 잡은 이유:
#   · functions 의 `npm test` 는 vitest라 타입을 안 본다
#   · 그 test 스크립트는 copy-crown 을 돌리지 않는다
#   · `npx tsc --noEmit` 은 디스크에 남은 옛 미러를 읽는다 — lib/ 원본이 바뀌어도 모른다
#   · functions && npm run build 를 도는 워크플로가 하나도 없었다
# 즉 테스트 1,344건이 전부 초록인데 배포가 안 되는 상태가 가능했다.
#
# `npm run build` 만이 copy-*.mjs 로 미러를 새로 만든 뒤 tsc를 돌린다.
# 그래서 이 가드는 tsc가 아니라 build 를 돌린다.
#
# path 필터를 두지 않는다 — 이번 사고의 원인 커밋은 functions/ 를 건드리지 않았다.
# lib/ 만 고친 PR이 functions 빌드를 깨뜨리는 것이 정확히 이 사고의 모양이다.
# 프리뷰·에뮬레이터가 필요 없어 빠르다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 미러 원본(lib/)이 루트에 있으므로 루트 의존성도 필요하다.
      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      # copy-*.mjs 로 미러를 새로 만든 뒤 tsc — 배포(predeploy)와 같은 명령이다.
      - name: Build functions (mirrors + tsc)
        run: npm run build
        working-directory: functions
