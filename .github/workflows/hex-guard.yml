name: Hardcoded hex guard (TOK-1)

# 컴포넌트에 raw hex가 다시 새어 들어오는 걸 막는 가드.
# 다른 워크플로와 달리 path 필터가 없다 — 이건 특정 모듈이 아니라 리포지토리
# 전체의 불변식이고, 새 파일이 어디에 생기든 잡아야 하기 때문이다.
# 프리뷰·에뮬레이터가 필요 없어 30초 안에 끝난다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 탐지·경로 제외·allowlist 로직 자체의 단위테스트 (핸드오프 §7).
      # 가드가 조용히 고장 나면 위반 0건도 의미가 없다.
      - name: Unit tests (guard logic)
        run: npm run test:unit -- lib/__tests__/hexGuard.test.ts

      - name: Check for hardcoded hex colours
        run: npm run check:hex
