name: dev-visual-aid E2E (Playwright)

# Patterned on c3-e2e.yml ([[feedback-workflow-spec-scope]]):
#   · Scoped to this module's files so other modules don't false-red.
#   · test:unit covers the pure logic (locale + dev nav + seed-preview CLI).
#   · E2E is GATED on PREVIEW_URL — skipped (not failed) until the
#     DEV_VISUAL_AID_PREVIEW_URL secret + Vercel Preview are provisioned by 대표.
#   · No emulator/rules/functions steps: this module adds no Firestore rules
#     and no Cloud Functions (seed-preview.mjs is an operator script, not a fn).

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/layout.tsx'
      - 'components/i18n/**'
      - 'components/dev/**'
      - 'components/layout/Navbar.tsx'
      - 'lib/locale.ts'
      - 'lib/useLocaleSync.ts'
      - 'lib/dev/**'
      - 'lib/__tests__/locale.test.ts'
      - 'lib/__tests__/dev/**'
      - 'lib/__tests__/seedPreview.test.ts'
      - 'functions/scripts/seed-preview.mjs'
      - 'functions/scripts/seed-preview.lib.mjs'
      - 'e2e/language-toggle.spec.ts'
      - 'e2e/dev-nav.spec.ts'
      - 'e2e/dev-nav-mobile-320.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/dev-visual-aid-e2e.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: ${{ secrets.DEV_VISUAL_AID_PREVIEW_URL }}
      TEST_UID: ${{ secrets.DEV_VISUAL_AID_TEST_UID }}
      FIREBASE_ADMIN_SDK_KEY: ${{ secrets.FIREBASE_ADMIN_SDK_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest) — locale + dev nav + seed-preview CLI
        run: npm run test:unit -- lib/__tests__/locale.test.ts lib/__tests__/dev lib/__tests__/seedPreview.test.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel Preview (skip if secret unset)
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "DEV_VISUAL_AID_PREVIEW_URL not set — skipping E2E."
            exit 0
          fi
          HEADER_ARGS=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADER_ARGS+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          for i in {1..30}; do
            if curl -fsSL --max-time 10 "${HEADER_ARGS[@]}" "$PREVIEW_URL" >/dev/null; then
              echo "Preview reachable at $PREVIEW_URL"; exit 0
            fi
            echo "Preview not ready (attempt $i) — sleeping 10s."; sleep 10
          done
          echo "Preview never became reachable." >&2; exit 1

      - name: E2E (Playwright) — dev-visual-aid specs only
        if: ${{ env.PREVIEW_URL != '' }}
        run: npm run test:e2e -- e2e/language-toggle.spec.ts e2e/dev-nav.spec.ts e2e/dev-nav-mobile-320.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-visual-aid-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace + video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-visual-aid-playwright-traces
          path: test-results/
          retention-days: 14
