name: ND-1 News Desk E2E (Playwright)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/news/**'
      - 'app/admin/newsdesk/**'
      - 'components/news/**'
      - 'components/admin/newsdesk/**'
      - 'components/media/**'
      - 'lib/news/**'
      - 'lib/media/**'
      - 'functions/src/generateNewsDraft.ts'
      - 'functions/src/onTournamentOpened.ts'
      - 'functions/src/onChampionForNews.ts'
      - 'functions/src/scheduleWeeklyNews.ts'
      - 'functions/src/newsShared.ts'
      - 'functions/src/core/news*.ts'
      - 'functions/src/core/translateArticleCore.ts'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'tests/rules/news.rules.test.ts'
      - 'e2e/nd1-news-desk.spec.ts'
      - 'playwright.config.ts'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: ${{ secrets.ND1_PREVIEW_URL }}
      TEST_UID: ${{ secrets.G1_TEST_ADMIN_UID }}
      TEST_EMAIL: ${{ secrets.G1_TEST_ADMIN_EMAIL }}
      FIREBASE_ADMIN_SDK_KEY: ${{ secrets.FIREBASE_ADMIN_SDK_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Firestore emulator (rules tier) needs a JRE — Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest — client: lib/news + lib/media)
        run: npm run test:unit -- lib/__tests__/news.articleDoc.test.ts lib/__tests__/news.renderArticle.test.ts lib/__tests__/news.blockEdit.test.ts lib/__tests__/news.mediaSlot.test.ts

      - name: Functions unit tests (vitest — news cores)
        run: |
          npm ci --prefix functions
          npm test --prefix functions

      - name: Firestore Rules tests (emulator — news published/draft/admin)
        run: npm run test:rules

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel Preview
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "ND1_PREVIEW_URL not set — skipping E2E wait/run."
            exit 0
          fi
          HEADER_ARGS=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADER_ARGS+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          for i in {1..30}; do
            if curl -fsSL --max-time 10 "${HEADER_ARGS[@]}" "$PREVIEW_URL" >/dev/null; then
              echo "Preview reachable at $PREVIEW_URL"
              exit 0
            fi
            echo "Preview not ready (attempt $i) — sleeping 10s."
            sleep 10
          done
          echo "Preview never became reachable." >&2
          exit 1

      - name: E2E (Playwright — nd1 spec only)
        if: ${{ env.PREVIEW_URL != '' }}
        # Scope to ND-1's own spec (§11.5 — feedback-workflow-spec-scope) so this
        # job never runs another module's spec against the wrong preview.
        run: npm run test:e2e -- e2e/nd1-news-desk.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nd1-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace + video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nd1-playwright-traces
          path: test-results/
          retention-days: 14
