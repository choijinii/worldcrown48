name: A-1 Pitch E2E (Playwright)

# Patterned on dev-visual-aid-e2e.yml ([[feedback-workflow-spec-scope]]):
#   · Scoped to A-1's files so other modules don't false-red.
#   · test:unit covers the pure logic (pitch store/newsroom/trending/labEntry
#     + the seed-preview CLI now that it owns the a1 module).
#   · No emulator/rules step: A-1 adds no Firestore rules; it reads the
#     tournaments collection via the composite index deployed in Phase C.
#
# PREVIEW_URL is resolved to THIS commit's OWN Vercel Preview deployment via the
# GitHub Deployments API (by head SHA) — same as news-/g1-/c1-/c2-/d1-e2e.yml.
# It was a frozen A1_PITCH_PREVIEW_URL secret until 2026-08-06 ([[feedback_c2_preview_url_pinned]]).
# That secret pinned one immutable deployment built before G-1 (`d4c7aba`, 2026-07-01)
# activated Domain 6, so `pitch.spec.ts` kept asserting "2 disabled" green for five
# weeks while the branch under review actually rendered 1 — the spec never ran against
# the PR's code. The pinned deployment was then garbage-collected and every run 410'd.
# There is NO A1_PITCH_PREVIEW_URL secret — do not create one.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - 'app/layout.tsx'
      - 'app/launch/**'
      - 'components/pitch/**'
      - 'components/layout/**'
      - 'components/launch/**'
      - 'lib/pitch/**'
      - 'lib/layout/**'
      - 'lib/launch/**'
      - 'lib/__tests__/pitch/**'
      - 'lib/__tests__/layout/**'
      - 'lib/__tests__/launch/**'
      - 'lib/__tests__/seedPreview.test.ts'
      - 'functions/scripts/seed-preview.mjs'
      - 'functions/scripts/seed-preview.lib.mjs'
      - 'firestore.indexes.json'
      - 'e2e/pitch.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/a1-pitch-e2e.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # PREVIEW_URL is NOT a secret — it is resolved per-commit from the GitHub
      # Deployments API below (see the "Resolve … Preview URL" step).
      TEST_UID: ${{ secrets.A1_PITCH_TEST_UID }}
      FIREBASE_ADMIN_SDK_KEY: ${{ secrets.FIREBASE_ADMIN_SDK_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest) — pitch / layout / launch logic + seed-preview CLI
        run: npm run test:unit -- lib/__tests__/pitch lib/__tests__/layout lib/__tests__/launch lib/__tests__/seedPreview.test.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Resolve this commit's own Vercel Preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Resolving the Preview deployment for commit $HEAD_SHA"
          URL=""
          for i in $(seq 1 40); do
            DID=$(gh api "repos/${{ github.repository }}/deployments?sha=$HEAD_SHA&environment=Preview" --jq '.[0].id // empty')
            if [ -n "$DID" ]; then
              URL=$(gh api "repos/${{ github.repository }}/deployments/$DID/statuses" \
                    --jq 'map(select(.state=="success"))[0].environment_url // empty')
            fi
            if [ -n "$URL" ]; then
              echo "Preview deployment ready: $URL"
              echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              break
            fi
            echo "Preview deployment for $HEAD_SHA not success yet (attempt $i/40) — sleeping 15s."
            sleep 15
          done
          if [ -z "$URL" ]; then
            echo "No successful Vercel Preview deployment for $HEAD_SHA after ~10m." >&2
            exit 1
          fi

      - name: Wait for Preview reachability (bypass-protected)
        run: |
          HEADER_ARGS=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADER_ARGS+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          for i in {1..30}; do
            if curl -fsSL --max-time 10 "${HEADER_ARGS[@]}" "$PREVIEW_URL" >/dev/null; then
              echo "Preview reachable at $PREVIEW_URL"; exit 0
            fi
            echo "Preview not reachable yet (attempt $i) — sleeping 10s."; sleep 10
          done
          echo "Preview never became reachable at $PREVIEW_URL." >&2; exit 1

      - name: E2E (Playwright) — pitch spec only
        run: npm run test:e2e -- e2e/pitch.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-pitch-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace + video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a1-pitch-playwright-traces
          path: test-results/
          retention-days: 14
