name: A-1 Pitch E2E (Playwright)

# Patterned on dev-visual-aid-e2e.yml ([[feedback-workflow-spec-scope]]):
#   · Scoped to A-1's files so other modules don't false-red.
#   · test:unit covers the pure logic (pitch store/newsroom/trending/labEntry
#     + the seed-preview CLI now that it owns the a1 module).
#   · E2E is GATED on PREVIEW_URL — skipped (not failed) until the
#     A1_PITCH_PREVIEW_URL secret + Vercel Preview are provisioned by 대표.
#   · No emulator/rules step: A-1 adds no Firestore rules; it reads the
#     tournaments collection via the composite index deployed in Phase C.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - 'app/layout.tsx'
      - 'app/launch/**'
      - 'components/pitch/**'
      - 'components/layout/**'
      - 'components/launch/**'
      - 'lib/pitch/**'
      - 'lib/layout/**'
      - 'lib/launch/**'
      - 'lib/__tests__/pitch/**'
      - 'lib/__tests__/layout/**'
      - 'lib/__tests__/launch/**'
      - 'lib/__tests__/seedPreview.test.ts'
      - 'functions/scripts/seed-preview.mjs'
      - 'functions/scripts/seed-preview.lib.mjs'
      - 'firestore.indexes.json'
      - 'e2e/pitch.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/a1-pitch-e2e.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: ${{ secrets.A1_PITCH_PREVIEW_URL }}
      TEST_UID: ${{ secrets.A1_PITCH_TEST_UID }}
      FIREBASE_ADMIN_SDK_KEY: ${{ secrets.FIREBASE_ADMIN_SDK_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest) — pitch / layout / launch logic + seed-preview CLI
        run: npm run test:unit -- lib/__tests__/pitch lib/__tests__/layout lib/__tests__/launch lib/__tests__/seedPreview.test.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel Preview (skip if secret unset)
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "A1_PITCH_PREVIEW_URL not set — skipping E2E."
            exit 0
          fi
          HEADER_ARGS=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADER_ARGS+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          for i in {1..30}; do
            if curl -fsSL --max-time 10 "${HEADER_ARGS[@]}" "$PREVIEW_URL" >/dev/null; then
              echo "Preview reachable at $PREVIEW_URL"; exit 0
            fi
            echo "Preview not ready (attempt $i) — sleeping 10s."; sleep 10
          done
          echo "Preview never became reachable." >&2; exit 1

      - name: E2E (Playwright) — pitch spec only
        if: ${{ env.PREVIEW_URL != '' }}
        run: npm run test:e2e -- e2e/pitch.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-pitch-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace + video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a1-pitch-playwright-traces
          path: test-results/
          retention-days: 14
