name: C-3 Ranking E2E (Playwright)

# Patterned on c2-e2e.yml ([[feedback-workflow-spec-scope]]):
#   · Each module's workflow scopes to its own spec(s) so other modules'
#     Playwright tests don't false-red against this Preview/secrets.
#   · paths: trigger this job ONLY on files C-3 actually depends on.
#   · test:unit covers lib/__tests__/ranking (50 tests added in Phase A).
#   · test:rules covers tests/rules/ranking-rules.test.ts (Phase C rules).
#   · test:e2e runs ONLY e2e/c3-ranking.spec.ts (Phase D).
#
# PREVIEW_URL is resolved to THIS commit's OWN Vercel Preview deployment via the
# GitHub Deployments API (by head SHA) — NOT a frozen C3_PREVIEW_URL secret
# ([[feedback_c2_preview_url_pinned]]). That secret was never provisioned, so the
# old `if [ -z "$PREVIEW_URL" ]` guard exited 0 and this job reported GREEN while
# running ZERO E2E tests. Resolving per-commit removes both failure modes: no
# stale target, and no silent skip. There is NO C3_PREVIEW_URL secret — do not
# create one.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/arena/**'
      - 'components/ranking/**'
      - 'lib/ranking/**'
      - 'lib/__tests__/ranking/**'
      - 'lib/firebase.ts'
      - 'functions/src/scheduleRankingCache.ts'
      - 'functions/src/onVote.ts'
      - 'functions/src/core/scheduleRankingCacheCore.ts'
      - 'functions/src/core/rankingAggregator.ts'
      - 'functions/scripts/copy-ranking.mjs'
      - 'functions/src/__tests__/scheduleRankingCacheCore.test.ts'
      - 'functions/src/__tests__/rankingAggregator.test.ts'
      - 'functions/src/__tests__/onVote.test.ts'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'tests/rules/ranking-rules.test.ts'
      - 'e2e/c3-**'
      - 'playwright.config.ts'
      - '.github/workflows/c3-e2e.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # PREVIEW_URL is NOT a secret — it is resolved per-commit from the GitHub
      # Deployments API below (see the "Resolve … Preview URL" step).
      # global-setup reads TEST_UID (custom-token sign-in); the C-3 spec reads
      # C3_TEST_UID for seeding. Both map to the same secret.
      TEST_UID: ${{ secrets.C3_TEST_UID }}
      C3_TEST_UID: ${{ secrets.C3_TEST_UID }}
      FIREBASE_ADMIN_SDK_KEY: ${{ secrets.FIREBASE_ADMIN_SDK_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Emulators (firestore + storage) need a JRE; firebase-tools requires
      # Java 21+ ([[feedback-firebase-tools-java21]]).
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-tools (emulator runner)
        run: npm i -g firebase-tools

      - name: Unit tests (vitest) — C-3 lib/ranking
        # Scope to lib/__tests__/ranking (Phase A's 50 tests). Other modules'
        # unit tests are covered by their own workflows.
        run: npm run test:unit -- lib/__tests__/ranking

      - name: Functions unit tests (vitest)
        # canvas is an optionalDependency — npm ci tolerates its native build
        # failing; the cores under test do not need it. Runs ALL functions
        # tests (incl. onVote, rankingAggregator, scheduleRankingCacheCore).
        run: |
          npm ci --prefix functions
          npm test --prefix functions

      - name: Rules tests (firestore + storage emulators)
        # Runs all tests/rules/*.test.ts — incl. ranking-rules.test.ts.
        run: npm run test:rules

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Resolve this commit's own Vercel Preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Resolving the Preview deployment for commit $HEAD_SHA"
          URL=""
          for i in $(seq 1 40); do
            DID=$(gh api "repos/${{ github.repository }}/deployments?sha=$HEAD_SHA&environment=Preview" --jq '.[0].id // empty')
            if [ -n "$DID" ]; then
              URL=$(gh api "repos/${{ github.repository }}/deployments/$DID/statuses" \
                    --jq 'map(select(.state=="success"))[0].environment_url // empty')
            fi
            if [ -n "$URL" ]; then
              echo "Preview deployment ready: $URL"
              echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              break
            fi
            echo "Preview deployment for $HEAD_SHA not success yet (attempt $i/40) — sleeping 15s."
            sleep 15
          done
          if [ -z "$URL" ]; then
            echo "No successful Vercel Preview deployment for $HEAD_SHA after ~10m." >&2
            exit 1
          fi

      - name: Wait for Preview reachability (bypass-protected)
        run: |
          HEADER_ARGS=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADER_ARGS+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          for i in {1..30}; do
            if curl -fsSL --max-time 10 "${HEADER_ARGS[@]}" "$PREVIEW_URL" >/dev/null; then
              echo "Preview reachable at $PREVIEW_URL"; exit 0
            fi
            echo "Preview not reachable yet (attempt $i) — sleeping 10s."; sleep 10
          done
          echo "Preview never became reachable at $PREVIEW_URL." >&2; exit 1

      - name: E2E (Playwright) — C-3 only
        # Scope to C-3's own spec ([[feedback-workflow-spec-scope]]).
        run: npm run test:e2e -- e2e/c3-ranking.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace + video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c3-playwright-traces
          path: test-results/
          retention-days: 14
