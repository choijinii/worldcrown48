name: IMAGE-1 E2E (emulator)

# IMAGE-1 PR 1 — 엔트리 그림(원장 D-77)의 E2E 4경로를 Firebase 에뮬레이터 위에서 돌린다(지시서 §11.3).
#
# 왜 미리보기(Vercel Preview)가 아니라 에뮬레이터인가: Storage 올리기 · 콜러블 두 개 · 발행(배치 + 복사)은
# 병합·배포 전에는 실서비스 Firebase 에 없다. 에뮬레이터(auth · firestore · storage · functions)는 이 PR 의
# 규칙과 함수를 그대로 싣는다. 프로젝트 id 는 demo-wc48 — 실제 프로젝트에 닿지 않는다. 바깥 사이트는
# 부르지 않는다(가짜 그림 서버는 시험 안의 로컬 http · 유튜브 포스터는 시험 그림으로 대신 · AI 주소는 닫힘).

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'functions/src/**'
      - 'functions/scripts/**'
      - 'storage.rules'
      - 'firestore.rules'
      - 'firebase.json'
      - 'e2e/emulator/**'
      - 'e2e/fixtures/entry-images/**'
      - 'playwright.emulator.config.ts'
      - 'scripts/e2e-emulator.sh'
      - 'e2e/global-teardown.ts'
      - '.github/workflows/image1-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 에뮬레이터는 JRE 가 필요하다 — firebase-tools 는 Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      # canvas(그림 줄이기 · 크라운 카드)는 보통 GitHub 에서 미리 만든 파일을 내려받는데, 그 내려받기가
      # 시간 초과로 막히면 원본 빌드로 넘어가고 시험 컴퓨터에 그래픽 부품이 없어 설치가 깨졌다(#157 · 2회 연속).
      # 부품을 먼저 깔고 늘 원본에서 빌드한다 — 내려받기에 기대지 않는다(1~2분 더 걸린다).
      - name: Install canvas build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
        env:
          npm_config_build_from_source: 'true'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # IMAGE-1 PR 2 지시서 §11 — 새 spec 은 파일 경로를 명시해 먼저 돌린다(함수 빌드 · next build 포함).
      # 진짜 Brave 는 부르지 않는다: 시험 안의 가짜 Brave(127.0.0.1:9311)를 함수가 BRAVE_API_BASE 로 부른다.
      - name: Emulator E2E — IMAGE-1 PR 2 (e2e/emulator/image1-pr2-search.spec.ts)
        env:
          CI: '1'
        run: bash scripts/e2e-emulator.sh e2e/emulator/image1-pr2-search.spec.ts

      # IMAGE-1 PR 3 지시서 §11 — 내리기 · 그림 확인 창 · 영상 카드 썸네일 spec 을 경로로 명시해 먼저 돌린다.
      # 유튜브 썸네일은 가짜 서버(127.0.0.1:9312 · YT_THUMB_BASE) — 진짜 유튜브를 부르지 않는다.
      - name: Emulator E2E — IMAGE-1 PR 3 (e2e/emulator/image1-pr3-takedown.spec.ts)
        env:
          CI: '1'
          SKIP_BUILD: '1'
        run: bash scripts/e2e-emulator.sh e2e/emulator/image1-pr3-takedown.spec.ts

      # LAB-FIX-5 지시서 §11 E2E ①~⑤ — 조건 검사 표시 · 새로고침 뒤 유지 · 조건이 비면 호출 없음 · ES 예시 글 · 번역 막기.
      - name: Emulator E2E — LAB-FIX-5 (e2e/emulator/lab-fix5.spec.ts)
        env:
          CI: '1'
          SKIP_BUILD: '1'
        run: bash scripts/e2e-emulator.sh e2e/emulator/lab-fix5.spec.ts

      # NEWS-0a 지시서 §11 E2E — 시험 대회(Lab 발행 · 시드)는 뉴스 초안을 만들지 않는다 · 시험 정리 뒤 초안 0.
      # 뉴스 초안 AI 를 이 단계에서만 켠다(가짜 AI 127.0.0.1:9313 · 진짜 AI 를 부르지 않는다). 다른 단계는 꺼진 그대로.
      - name: Emulator E2E — NEWS-0a (e2e/emulator/news0a-test-drafts.spec.ts)
        env:
          CI: '1'
          SKIP_BUILD: '1'
          NEWS_DRAFT_AI: 'on'
        run: bash scripts/e2e-emulator.sh e2e/emulator/news0a-test-drafts.spec.ts

      # NEWS-1 지시서 §11 E2E — 편집 방침 저장 → 주간 초안 지시문에 그 줄 · 틀린 가짜 응답 → checkWarnings · 차트 설명창 "점유율".
      # 관리자 콜러블(generateNewsDraft)만 쓰므로 뉴스 AI 스위치는 그대로 끔(가짜 AI 127.0.0.1:9313 · 진짜 AI 를 부르지 않는다).
      - name: Emulator E2E — NEWS-1 (e2e/emulator/news1-tio-knowledge.spec.ts)
        env:
          CI: '1'
          SKIP_BUILD: '1'
        run: bash scripts/e2e-emulator.sh e2e/emulator/news1-tio-knowledge.spec.ts

      # NEWS-2 — 결정 J(경고 남은 초안 발행 막힘 · [경고 풀기] · 저장 뒤 재검사) · 주간 대회 세기 · Share/Cuota.
      - name: Emulator E2E — NEWS-2 (e2e/emulator/news2-publish-gate.spec.ts)
        env:
          CI: '1'
          SKIP_BUILD: '1'
        run: bash scripts/e2e-emulator.sh e2e/emulator/news2-publish-gate.spec.ts

      # 그 다음 에뮬레이터 spec 전부(빌드는 위에서 끝났다).
      - name: Emulator E2E (all specs)
        env:
          CI: '1'
          SKIP_BUILD: '1'
        run: bash scripts/e2e-emulator.sh

      - name: Upload report · video · trace · evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image1-e2e-emulator
          path: |
            playwright-report-emulator
            test-results-emulator
            outputs/image-1-pr1-evidence
            outputs/image-1-pr3-evidence
          retention-days: 14
