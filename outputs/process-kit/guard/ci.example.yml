name: Rules guard

# 규칙 재유입 가드. 다른 워크플로와 달리 path 필터가 없다 — 이건 특정 모듈이
# 아니라 리포 전체의 불변식이고, 새 파일이 어디에 생기든 잡아야 하기 때문이다.
# 프리뷰·에뮬레이터가 필요 없어 1분 안에 끝난다.
#
# 설치: .github/workflows/rules-guard.yml 로 복사하고 자리표시자를 채운다.
# 자리표시자를 따옴표로 감싼 이유: YAML에서 `{` 로 시작하는 값은 flow mapping
# 으로 읽혀 치환 전 파일이 문법 오류가 된다. 따옴표를 지우지 말 것.

on:
  pull_request:
    branches: ['{{MAIN_BRANCH}}']
  push:
    branches: ['{{MAIN_BRANCH}}']

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '{{NODE_VERSION}}'
          cache: '{{PKG_MANAGER}}'

      - name: Install dependencies
        run: '{{INSTALL_CMD}}'

      # 가드 로직 자체의 단위테스트.
      # 가드가 조용히 고장 나면 "위반 0건"도 의미가 없다 — 탐지·범위·예외
      # 로직을 먼저 검증하고 나서 실제 스캔을 돌린다.
      - name: Unit tests (guard logic)
        run: '{{TEST_CMD}} -- check-rules'

      - name: Check repository rules
        run: '{{GUARD_CMD}}'
