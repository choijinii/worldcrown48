      <g transform="translate(60,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(75,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(90,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(105,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(120,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(135,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(150,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(165,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(180,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(195,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(210,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(225,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(240,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(255,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(270,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(285,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(300,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(315,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(330,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(345,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
    </g>

    <text x="187" y="62" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">ROUND OF 24 · 12 Match</text>
    <g transform="translate(50,72)" fill="#FCD006" stroke="#111827" stroke-width="0.5">
      <g><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(25,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(50,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(75,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(100,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(125,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(150,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(175,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(200,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(225,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(250,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
      <g transform="translate(275,0)"><circle cx="2.5" cy="3" r="2.5"/><circle cx="9.5" cy="3" r="2.5"/></g>
    </g>

    <text x="187" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">ROUND OF 12 · 6 Match</text>
    <g transform="translate(80,118)" fill="#FCD006" stroke="#111827" stroke-width="0.5">
      <g><circle cx="3" cy="3.5" r="3"/><circle cx="11" cy="3.5" r="3"/></g>
      <g transform="translate(40,0)"><circle cx="3" cy="3.5" r="3"/><circle cx="11" cy="3.5" r="3"/></g>
      <g transform="translate(80,0)"><circle cx="3" cy="3.5" r="3"/><circle cx="11" cy="3.5" r="3"/></g>
