      <g transform="translate(200,0)"><circle cx="3" cy="3.5" r="3"/><circle cx="11" cy="3.5" r="3"/></g>
    </g>

    <text x="187" y="155" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">ROUND OF 6 · 3 Match</text>
    <g transform="translate(125,165)" fill="#FCD006" stroke="#111827" stroke-width="0.5">
      <g><circle cx="4" cy="4" r="3.5"/><circle cx="13" cy="4" r="3.5"/></g>
      <g transform="translate(50,0)"><circle cx="4" cy="4" r="3.5"/><circle cx="13" cy="4" r="3.5"/></g>
      <g transform="translate(100,0)"><circle cx="4" cy="4" r="3.5"/><circle cx="13" cy="4" r="3.5"/></g>
    </g>

    <rect x="80" y="188" width="215" height="48" rx="6" fill="#111827" stroke="#FCD006" stroke-width="2"/>
    <text x="187" y="206" text-anchor="middle" font-size="11" font-weight="800" fill="#FCD006">THE FINAL · 3명 중 1명 직접 선택</text>
    <text x="187" y="219" text-anchor="middle" font-size="9" fill="#FDE68A">1v1 매치 아님 — 3명 동시 표시, Voter 직접 선택</text>
    <g transform="translate(157,225)" fill="#FCD006" stroke="white" stroke-width="0.8">
      <circle cx="5" cy="5" r="4.5"/>
      <circle cx="20" cy="5" r="4.5"/>
      <circle cx="35" cy="5" r="4.5"/>
    </g>

    <g transform="translate(187,260)">
      <circle r="14" fill="#FCD006" stroke="#111827" stroke-width="2"/>
      <text text-anchor="middle" font-size="14" y="5">👑</text>
    </g>
    <text x="187" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Champion</text>
  </g>

  <rect x="425" y="565" width="395" height="195" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
  <rect x="425" y="565" width="395" height="32" rx="6" fill="#16A34A"/>
  <text x="622" y="585" text-anchor="middle" font-size="11" font-weight="800" fill="white">[허용] 다음 원칙만 따른다 [허용]</text>

  <text x="440" y="615" font-size="10" font-weight="600" fill="#14532D">[O] Tournament Deadline만 존재한다 (Round Deadline은 없다)</text>
  <text x="440" y="640" font-size="10" font-weight="600" fill="#14532D">[O] Vote Rate(%)는 랭킹 화면에서만 노출한다</text>
  <text x="440" y="665" font-size="10" font-weight="600" fill="#14532D">[O] 라운드는 48 → 24 → 12 → 6 → THE FINAL 순서로 진행한다</text>
  <text x="440" y="690" font-size="10" font-weight="600" fill="#14532D">[O] Voter가 마지막 Match를 끝내면 advanceRound()가 자동 실행된다</text>
  <text x="440" y="715" font-size="10" font-weight="600" fill="#14532D">[O] Round 이름은 라운드 전환 이벤트에서만 표시 (매치 화면 HUD 없음)</text>
  <text x="440" y="740" font-size="10" font-weight="600" fill="#14532D">[O] Champion 확정 시 Crown Card를 생성하고 SNS로 공유한다</text>

  <rect x="20" y="785" width="800" height="28" rx="6" fill="#111827"/>
  <text x="420" y="804" text-anchor="middle" font-size="11" font-weight="700" fill="#FCD006">스스로에게 물어볼 것 — "이 기능은 Voter 개인의 트리 통과에 필요한가? 아니면 라이브 이벤트 가정인가?"</text>
</svg>
