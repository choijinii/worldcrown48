<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@1,400;1,700;1,900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_ds/worldcrown48-design-system-ea92b82a-a241-44e7-89f6-ae6f0746d6fb/colors_and_type.css">
  <link rel="stylesheet" href="_ds/worldcrown48-design-system-ea92b82a-a241-44e7-89f6-ae6f0746d6fb/arena_stage_tokens.css">
  <link rel="stylesheet" href="_ds/worldcrown48-design-system-ea92b82a-a241-44e7-89f6-ae6f0746d6fb/ui_kits/web/kit.css">
  <script src="_ds/worldcrown48-design-system-ea92b82a-a241-44e7-89f6-ae6f0746d6fb/_ds_bundle.js"></script>
  <script src="image-slot.js"></script>
  <style>
    @keyframes wcKenA { from { transform: scale(1) translate(0,0); } to { transform: scale(1.08) translate(-1.5%, 1%); } }
    @keyframes wcKenB { from { transform: scale(1.08) translate(1.5%, -1%); } to { transform: scale(1) translate(0,0); } }
    @media (prefers-reduced-motion: reduce) { [data-ken] { animation: none !important; } }
  </style>
</helmet>
<div style="position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#07070D;display:flex;container-type:inline-size;font-family:Inter,Pretendard,'Apple SD Gothic Neo',sans-serif">
  <div style="position:relative;flex:1;min-width:0;overflow:hidden;background:#241754;border-bottom:2px solid #00A3B7;box-sizing:border-box">
    <div data-ken="a" style="position:absolute;inset:0;animation:{{ kenA }}"><image-slot id="{{ slotA }}" src="{{ srcA }}" credit="{{ crA }}" credit-href="{{ hrA }}" fit="cover" shape="rect" placeholder="{{ hintA }}" style="display:block;width:100%;height:100%"></image-slot></div>
    <div style="position:absolute;inset:0;background:var(--arena-cell-shade);pointer-events:none"></div>
    <span style="position:absolute;left:10px;top:9px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:rgba(242,242,245,.72);pointer-events:none">{{ nameA }}</span>
  </div>
  <div style="width:1px;flex:none;background:rgba(255,255,255,.10)"></div>
  <div style="position:relative;flex:1;min-width:0;overflow:hidden;background:#1B1931;border-bottom:2px solid #D7063A;box-sizing:border-box">
    <div data-ken="b" style="position:absolute;inset:0;animation:{{ kenB }}"><image-slot id="{{ slotB }}" src="{{ srcB }}" credit="{{ crB }}" credit-href="{{ hrB }}" fit="cover" shape="rect" placeholder="{{ hintB }}" style="display:block;width:100%;height:100%"></image-slot></div>
    <div style="position:absolute;inset:0;background:var(--arena-cell-shade);pointer-events:none"></div>
    <span style="position:absolute;right:10px;top:9px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:rgba(242,242,245,.72);pointer-events:none">{{ nameB }}</span>
  </div>
  <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:10cqw;line-height:1;color:#FCD006;text-shadow:0 0 18px rgba(0,0,31,.42), 0 0 6px rgba(0,0,31,.28);pointer-events:none">VS</span>
  <sc-if value="{{ showTitle }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:0;right:0;bottom:2px;padding:36px 14px 12px;background:linear-gradient(180deg, rgba(11,16,32,0), rgba(11,16,32,.78));pointer-events:none">
      <span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:{{ titlePx }};font-weight:700;line-height:1.3;letter-spacing:-.01em;color:#F2F2F5;text-wrap:pretty">{{ title }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:270},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;대회 제목&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;tsType&quot;:&quot;number&quot;},&quot;nameA&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;aespa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nameB&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;NewJeans&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;vs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ken&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showTitle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, ken = !!p.ken, id = p.slotId || "vs";
    return {
      kenA: ken ? "wcKenA 10s linear infinite alternate" : "none",
      kenB: ken ? "wcKenB 10s linear infinite alternate" : "none",
      slotA: id + "-a", slotB: id + "-b", srcA: p.srcA || "", srcB: p.srcB || "", crA: p.crA || "", crB: p.crB || "", hrA: p.hrA || "", hrB: p.hrB || "",
      hintA: (p.nameA || "엔트리 A") + " 포스터", hintB: (p.nameB || "엔트리 B") + " 포스터",
      nameA: p.nameA || "", nameB: p.nameB || "",
      showTitle: p.showTitle !== false && !!p.title,
      title: p.title || "", titlePx: (p.titleSize || 16) + "px"
    };
  }
}
</script>
</body>
</html>
