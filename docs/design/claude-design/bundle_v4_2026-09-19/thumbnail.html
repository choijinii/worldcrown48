<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0}
.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
.main{background:#00003A;display:flex;align-items:center;justify-content:center;padding:0 60px}
.main img{width:100%;max-width:820px;height:auto}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}
</style></head><body>
<div class="tile">
  <div class="main"><img src="assets/wc48-branding-horizontal-dark.svg" alt="WorldCrown48"></div>
  <div class="strip">
    <i style="background:#EEDA7D"></i>
    <i style="background:#FCD006"></i>
    <i style="background:#00A3B7"></i>
    <i style="background:#D7063A"></i>
  </div>
</div>
</body></html>
