<!-- @dsCard group="Spacing" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">Shadow tokens · colored shadows lift CTA + state surfaces</div>
<div class="grid-3" style="gap:14px;">
  <div style="padding:24px 18px; background:var(--color-bg-default); border:1px solid var(--color-border); border-radius:5px; text-align:center;">
    <div style="width:80%; margin:0 auto; padding:22px 14px; background:var(--color-bg-soft); border-radius:5px; box-shadow: var(--shadow-card); border:1px solid var(--color-border);">
      <div style="font-size:12px; font-weight:600;">--shadow-card</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--color-text-sub); margin-top:4px;">general lift</div>
    </div>
  </div>
  <div style="padding:24px 18px; background:var(--color-bg-default); border:1px solid var(--color-border); border-radius:5px; text-align:center;">
    <div style="width:80%; margin:0 auto; padding:22px 14px; background:var(--color-bg-soft); border-radius:5px; box-shadow: var(--shadow-gold); border:1px solid var(--color-border);">
      <div style="font-size:12px; font-weight:600; color:var(--color-gold);">--shadow-gold</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--color-text-sub); margin-top:4px;">CTA · winner · halo</div>
    </div>
  </div>
  <div style="padding:24px 18px; background:var(--color-bg-default); border:1px solid var(--color-border); border-radius:5px; text-align:center;">
    <div style="width:80%; margin:0 auto; padding:22px 14px; background:var(--color-bg-soft); border-radius:5px; box-shadow: var(--shadow-crimson); border:1px solid var(--color-border);">
      <div style="font-size:12px; font-weight:600; color:var(--color-crimson);">--shadow-crimson</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--color-text-sub); margin-top:4px;">error · live · VS right</div>
    </div>
  </div>
  <div style="padding:24px 18px; background:var(--color-bg-default); border:1px solid var(--color-border); border-radius:5px; text-align:center;">
    <div style="width:80%; margin:0 auto; padding:22px 14px; background:var(--color-bg-soft); border-radius:5px; box-shadow: var(--shadow-turquoise); border:1px solid var(--color-border);">
      <div style="font-size:12px; font-weight:600; color:var(--color-turquoise);">--shadow-turquoise</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--color-text-sub); margin-top:4px;">success · VS left</div>
    </div>
  </div>
  <div style="padding:24px 18px; background:var(--color-bg-default); border:1px solid var(--color-border); border-radius:5px; text-align:center;">
    <div style="width:80%; margin:0 auto; padding:14px 10px; background:var(--color-bg-charcoal); border-radius:999px; box-shadow: var(--shadow-gnb); border:1px solid rgba(252,208,6,0.12);">
      <div style="font-size:12px; font-weight:600; color:var(--color-gold);">--shadow-gnb</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--color-text-sub); margin-top:4px;">Floating Island</div>
    </div>
  </div>
  <div style="padding:24px 18px; background:#F2F2F5; border:1px solid #D4DCE3; border-radius:5px; text-align:center;">
    <div style="width:80%; margin:0 auto; padding:22px 14px; background:#fff; border-radius:5px; box-shadow: var(--shadow-light); border:1px solid #D4DCE3;">
      <div style="font-size:12px; font-weight:600; color:#241754;">--shadow-light</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:#6B7A99; margin-top:4px;">light theme · Domain 4–6</div>
    </div>
  </div>
</div>
</div></body></html>
