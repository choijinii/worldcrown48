<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">Lockup · Crown + Wordmark · primary brand mark</div>
<div class="grid-2" style="gap:10px;">
  <div style="border:1px solid var(--color-border); border-radius:5px; overflow:hidden;">
    <div style="height:80px; display:flex; align-items:center; justify-content:center; background:#F2F2F5; padding:14px 20px;">
      <img src="../assets/wc48-branding-horizontal-light.svg" style="max-height:100%; max-width:100%;">
    </div>
    <div style="padding:6px 10px; font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-sub);">horizontal · light</div>
  </div>
  <div style="border:1px solid var(--color-border); border-radius:5px; overflow:hidden;">
    <div style="height:80px; display:flex; align-items:center; justify-content:center; background:var(--color-bg-deep); padding:14px 20px;">
      <img src="../assets/wc48-branding-horizontal-dark.svg" style="max-height:100%; max-width:100%;">
    </div>
    <div style="padding:6px 10px; font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-sub);">horizontal · dark</div>
  </div>
  <div style="border:1px solid var(--color-border); border-radius:5px; overflow:hidden;">
    <div style="height:160px; display:flex; align-items:center; justify-content:center; background:#F2F2F5; padding:18px;">
      <img src="../assets/wc48-branding-vertical-light.svg" style="max-height:124px;">
    </div>
    <div style="padding:6px 10px; font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-sub);">vertical · light</div>
  </div>
  <div style="border:1px solid var(--color-border); border-radius:5px; overflow:hidden;">
    <div style="height:160px; display:flex; align-items:center; justify-content:center; background:var(--color-bg-deep); padding:18px;">
      <img src="../assets/wc48-branding-vertical-dark.svg" style="max-height:124px;">
    </div>
    <div style="padding:6px 10px; font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-sub);">vertical · dark</div>
  </div>
</div>
</div></body></html>
