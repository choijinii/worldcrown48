<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card light">
<div class="kicker kicker--mut">Light theme · Domain 6 · Admin Dashboard</div>
<div style="background: var(--color-bg-light); color: var(--color-text-light); padding:24px; border:1px solid var(--color-border-light); border-radius:5px;">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
    <img src="../assets/wc48-branding-horizontal-light.svg" style="height:24px;">
    <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; color:var(--color-text-muted-light); font-weight:600;">ADMIN · DASHBOARD</span>
  </div>
  <div class="grid-4" style="gap:10px; margin-bottom:14px;">
    <div style="background:#fff; border:1px solid var(--color-border-light); border-radius:5px; padding:14px 16px; box-shadow: var(--shadow-light);">
      <div style="font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-muted-light); letter-spacing:0.2em; margin-bottom:8px;">ACTIVE TOURNAMENTS</div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:26px; color:var(--color-text-light); letter-spacing:-0.01em;">12</div>
      <div style="font-size:11px; color:var(--color-text-muted-light); margin-top:3px;">+2 this week</div>
    </div>
    <div style="background:#fff; border:1px solid var(--color-border-light); border-radius:5px; padding:14px 16px; box-shadow: var(--shadow-light);">
      <div style="font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-muted-light); letter-spacing:0.2em; margin-bottom:8px;">VOTES TODAY</div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:26px; color:var(--color-text-light); letter-spacing:-0.01em;">8,431</div>
      <div style="font-size:11px; color:var(--color-text-muted-light); margin-top:3px;">−3% vs avg</div>
    </div>
    <div style="background:#fff; border:1px solid var(--color-border-light); border-radius:5px; padding:14px 16px; box-shadow: var(--shadow-light);">
      <div style="font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-muted-light); letter-spacing:0.2em; margin-bottom:8px;">NEW FANS</div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:26px; color:var(--color-text-light); letter-spacing:-0.01em;">247</div>
      <div style="font-size:11px; color:var(--color-text-muted-light); margin-top:3px;">+18%</div>
    </div>
    <div style="background:#fff; border:1px solid var(--color-border-light); border-radius:5px; padding:14px 16px; box-shadow: var(--shadow-light);">
      <div style="font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-muted-light); letter-spacing:0.2em; margin-bottom:8px;">PENDING REVIEWS</div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:26px; color:var(--color-text-light); letter-spacing:-0.01em;">3</div>
      <div style="font-size:11px; color:var(--color-crimson); margin-top:3px; font-family:var(--font-mono); letter-spacing:0.04em;">T-1 alert</div>
    </div>
  </div>
  <div style="background:#fff; border:1px solid var(--color-border-light); border-radius:5px; padding:16px; box-shadow: var(--shadow-light);">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;">
      <h4 style="margin:0; font-size:14px; font-weight:700; color:var(--color-text-light);">Recent News</h4>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--color-gold-hover); letter-spacing:0.18em; font-weight:600;">VIEW ALL →</span>
    </div>
    <div style="display:grid; grid-template-columns:1fr 100px 80px; gap:12px; padding:10px 0; align-items:center; border-top:1px solid var(--color-border-light);">
      <div>
        <div style="font-size:13px; font-weight:600; color:var(--color-text-light);">신인 무대가 56%로 24강 역전</div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--color-text-muted-light); margin-top:1px;">T-2 · K-Pop</div>
      </div>
      <span style="display:inline-flex; padding:3px 10px; border-radius:999px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; font-weight:600; background:rgba(0,163,183,0.12); color:#007988; border:1px solid rgba(0,163,183,0.35);">APPROVED</span>
      <button style="padding:6px 12px; background:var(--color-gold); color:#241754; border:0; border-radius:5px; font-size:11px; font-weight:700; cursor:pointer;">Review</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr 100px 80px; gap:12px; padding:10px 0; align-items:center; border-top:1px solid var(--color-border-light);">
      <div>
        <div style="font-size:13px; font-weight:600; color:var(--color-text-light);">Sentiment surge detected · K-Pop 24강</div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--color-text-muted-light); margin-top:1px;">T-2 · K-Pop</div>
      </div>
      <span style="display:inline-flex; padding:3px 10px; border-radius:999px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; font-weight:600; background:rgba(252,208,6,0.18); color:#9C7E03; border:1px solid rgba(252,208,6,0.4);">PENDING</span>
      <button style="padding:6px 12px; background:var(--color-gold); color:#241754; border:0; border-radius:5px; font-size:11px; font-weight:700; cursor:pointer;">Review</button>
    </div>
  </div>
</div>
</div></body></html>
