<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.thesis {
  position: relative;
  height: 240px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-border);
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse 50% 60% at 80% 10%, rgba(252,208,6,0.18), transparent 60%),
    radial-gradient(ellipse 50% 60% at 10% 100%, rgba(0,163,183,0.12), transparent 65%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(215,6,58,0.06), transparent 70%),
    var(--color-bg-deep);
}
.thesis::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.06;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.thesis__kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.32em;
  color: var(--color-gold);
  text-transform: uppercase;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px;
}
.thesis__kicker::before, .thesis__kicker::after {
  content: ""; width: 24px; height: 1px; background: var(--color-gold);
}
.thesis__ko {
  font-family: var(--font-sans); font-weight: 600; font-size: 16px;
  color: var(--color-aura); letter-spacing: -0.005em;
  margin-bottom: 8px;
}
.thesis__en {
  font-family: var(--font-display); font-style: italic; font-weight: 900;
  font-size: 30px; line-height: 1.05; color: var(--color-text);
  letter-spacing: -0.025em; text-align: center;
}
.thesis__en em { color: var(--color-gold); }
.thesis__sig {
  margin-top: 18px; font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--color-text-muted);
}
</style></head><body><div class="card">
<div class="thesis">
  <div class="thesis__kicker">North Star · 절대 원칙 #0</div>
  <div class="thesis__ko">모든 화면은 디지털 악기처럼 느껴져야 한다</div>
  <div class="thesis__en">Every screen should feel like a <em>digital instrument</em>.</div>
  <div class="thesis__sig">WC48 DESIGN SYSTEM · v2.3 · TWILIGHT STADIUM</div>
</div>
</div></body></html>
