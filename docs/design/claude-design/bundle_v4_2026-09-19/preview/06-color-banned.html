<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">Banned colors</div>
<div style="display:flex; gap:14px; align-items:stretch;">
  <div style="flex:1; padding:14px 16px; border:1px solid rgba(215,6,58,0.35); border-radius:5px; background:rgba(215,6,58,0.06);">
    <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em; color:var(--color-crimson); font-weight:700;">PURE BLACK</div>
    <div style="margin-top:8px; height:32px; background:#000; border-radius:3px;"></div>
    <div style="margin-top:8px; font-size:12px; color:var(--color-text-sub); line-height:1.45;">
      Dark backgrounds are <strong style="color:var(--color-text)">navy-indigo</strong>, never <code style="font-family:var(--font-mono); color:var(--color-crimson);">#000000</code>. The Twilight palette is the floor.
    </div>
  </div>
  <div style="flex:1; padding:14px 16px; border:1px solid rgba(215,6,58,0.35); border-radius:5px; background:rgba(215,6,58,0.06);">
    <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em; color:var(--color-crimson); font-weight:700;">LEGACY v1 GRAYS</div>
    <div style="margin-top:8px; display:flex; gap:4px;">
      <div style="flex:1; height:32px; background:#05070A; border-radius:3px;"></div>
      <div style="flex:1; height:32px; background:#0A0D12; border-radius:3px;"></div>
      <div style="flex:1; height:32px; background:#F8FAFC; border-radius:3px;"></div>
      <div style="flex:1; height:32px; background:#30363D; border-radius:3px;"></div>
    </div>
    <div style="margin-top:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--color-crimson); line-height:1.5;">
      #05070A · #0A0D12 · #F8FAFC · #30363D — retired. v2.3 is the only source.
    </div>
  </div>
  <div style="flex:1; padding:14px 16px; border:1px solid rgba(215,6,58,0.35); border-radius:5px; background:rgba(215,6,58,0.06);">
    <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em; color:var(--color-crimson); font-weight:700;">FLUORESCENT</div>
    <div style="margin-top:8px; display:flex; gap:4px;">
      <div style="flex:1; height:32px; background:#F0FF00; border-radius:3px;"></div>
      <div style="flex:1; height:32px; background:#00FF66; border-radius:3px;"></div>
      <div style="flex:1; height:32px; background:#FF1493; border-radius:3px;"></div>
    </div>
    <div style="margin-top:8px; font-size:12px; color:var(--color-text-sub); line-height:1.45;">
      Crown Gold + Aura Yellow are the only golds. Anything more saturated reads as AI slop.
    </div>
  </div>
</div>
</div></body></html>
