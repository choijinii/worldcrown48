<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field__label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-text-sub);
}
.field__input {
  width: 100%; padding: 12px 14px;
  background: var(--color-bg-soft); color: var(--color-text);
  border: 1px solid var(--color-border);
  border-radius: 5px;
  font-family: var(--font-sans); font-size: 14px;
  outline: 0;
  transition: border-color 200ms, box-shadow 200ms;
}
.field__input::placeholder { color: var(--color-text-muted); }
.field--focus .field__input { border-color: var(--color-gold); box-shadow: var(--shadow-gold); }
.field--error  .field__input { border-color: var(--color-crimson); box-shadow: var(--shadow-crimson); }
.field__help { font-size: 11.5px; color: var(--color-text-sub); }
.field--error  .field__help { color: var(--color-crimson); font-family: var(--font-mono); }
</style></head><body><div class="card">
<div class="kicker">Form field · gold hairline on focus · crimson on error</div>
<div class="grid-2">
  <div>
    <div class="field">
      <label class="field__label">Email</label>
      <input class="field__input" placeholder="you@worldcrown48.com">
      <span class="field__help">We'll only notify you at launch.</span>
    </div>
  </div>
  <div>
    <div class="field field--focus">
      <label class="field__label">Tournament title</label>
      <input class="field__input" value="최고의 퍼포먼스 무대">
      <span class="field__help" style="color: var(--color-gold);">Focus · gold hairline + halo</span>
    </div>
  </div>
  <div>
    <div class="field field--error">
      <label class="field__label">Display name</label>
      <input class="field__input" value="M">
      <span class="field__help">! Name must be at least 2 characters</span>
    </div>
  </div>
  <div>
    <div class="field" style="opacity: 0.55;">
      <label class="field__label">Locale (locked)</label>
      <input class="field__input" value="한국어 (ko)" disabled>
      <span class="field__help">Locked until tournament starts</span>
    </div>
  </div>
</div>
<div style="margin-top:4px; font-family:var(--font-mono); font-size:10.5px; color:var(--color-text-muted); letter-spacing:0.1em; line-height:1.55;">
  Hit area ≥ <strong style="color:var(--color-gold)">44px</strong>. Label sits above in mono caps. Helper sits below — switches to Crimson mono for errors.
</div>
</div></body></html>
